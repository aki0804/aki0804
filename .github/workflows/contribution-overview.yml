name: Update contribution overview

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/contribution-overview.yml'

permissions:
  contents: write

concurrency:
  group: contribution-overview
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch contribution counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f login="$GITHUB_REPOSITORY_OWNER" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  totalCommitContributions
                  totalPullRequestContributions
                  totalPullRequestReviewContributions
                  totalIssueContributions
                }
              }
            }' > "$RUNNER_TEMP/contributions.json"
      - name: Render light and dark SVGs
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads((Path(os.environ['RUNNER_TEMP']) / 'contributions.json').read_text())
          if payload.get('errors'):
              raise RuntimeError('GitHub GraphQL request failed')
          stats = payload['data']['user']['contributionsCollection']
          reviews, issues, prs, commits = (int(stats[key]) for key in (
              'totalPullRequestReviewContributions', 'totalIssueContributions',
              'totalPullRequestContributions', 'totalCommitContributions'))
          counts = [reviews, issues, prs, commits]
          total = sum(counts)
          percentages = [round(n * 100 / total) if total else 0 for n in counts]
          review_pct, issue_pct, pr_pct, commit_pct = percentages
          scale = max(counts) or 1
          lengths = [112 * n / scale for n in counts]
          points = [(250, 173-lengths[0]), (250+lengths[1], 173),
                    (250, 173+lengths[2]), (250-lengths[3], 173)]
          coords = ' '.join(f'{x:.2f},{y:.2f}' for x,y in points)
          label = f'Contribution overview: commits {commit_pct}%, pull requests {pr_pct}%, code review {review_pct}%, issues {issue_pct}%'
          out = Path('assets')
          out.mkdir(exist_ok=True)
          for theme, bg, border, fg, muted, green in [
              ('light', '#f6f8fa', '#d0d7de', '#24292f', '#57606a', '#1a7f37'),
              ('dark', '#0d1117', '#30363d', '#e6edf3', '#8b949e', '#3fb950'),
          ]:
              circles = '\n'.join(f'<circle cx="{x:.2f}" cy="{y:.2f}" r="3.5" fill="{bg}" stroke="{green}" stroke-width="2"/>' for x,y in points)
              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="500" height="342" viewBox="0 0 500 342" role="img" aria-label="{label}">
          <rect x=".5" y=".5" width="499" height="341" rx="10" fill="{bg}" stroke="{border}"/>
          <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" fill="{fg}">
          <text x="250" y="29" font-size="18" font-weight="600">Contribution overview</text>
          <text x="250" y="50" font-size="12" fill="{muted}">Past year · Visible contributions</text>
          <path d="M138 173H362 M250 61V285" stroke="{green}" stroke-width="2" stroke-linecap="round" transform="translate(0 10)"/>
          <g transform="translate(0 10)">
          <polygon points="{coords}" fill="{green}" fill-opacity=".35" stroke="{green}" stroke-width="1.5" stroke-linejoin="round"/>
          {circles}
          </g>
          <g font-size="14"><text x="250" y="66">{review_pct}% · Code review</text><text x="375" y="179" text-anchor="start">{issue_pct}%</text><text x="375" y="197" text-anchor="start">Issues</text><text x="250" y="316">{pr_pct}% · Pull requests</text><text x="125" y="179" text-anchor="end">{commit_pct}%</text><text x="125" y="197" text-anchor="end">Commits</text></g>
          </g></svg>
          '''
              (out / f'contribution-overview.{theme}.svg').write_text(svg, encoding='utf-8')
          PY
      - name: Commit updated charts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contribution-overview.light.svg assets/contribution-overview.dark.svg
          if git diff --cached --quiet; then
            echo "No chart changes"
            exit 0
          fi
          git commit -m "Update contribution overview charts"
          git pull --rebase origin main
          git push origin HEAD:main
